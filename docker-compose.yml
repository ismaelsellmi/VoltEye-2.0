# VoltEye 2.0 : base temporelle, broker MQTT, API, passerelle edge simulée et application web
# Lancement : docker compose up --build    (application : http://localhost:8080, API : http://localhost:8000/docs)
name: volteye

services:
  db:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_USER: volteye
      POSTGRES_PASSWORD: volteye
      POSTGRES_DB: volteye
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U volteye -d volteye"]
      interval: 5s
      timeout: 5s
      retries: 20

  mqtt:
    image: eclipse-mosquitto:2.0.20
    volumes:
      - ./docker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - "11883:1883"

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://volteye:volteye@db:5432/volteye
      MQTT_HOST: mqtt
    depends_on:
      db:
        condition: service_healthy
      mqtt:
        condition: service_started
    ports:
      - "8000:8000"

  edge:
    build:
      context: .
      dockerfile: docker/edge.Dockerfile
    environment:
      MQTT_HOST: mqtt
      SITE: usine-ref
      MODE: simulation
    depends_on:
      - mqtt
      - api

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    depends_on:
      - api
    ports:
      - "8080:80"

  edge-hipe:
    build:
      context: .
      dockerfile: docker/edge.Dockerfile
    environment:
      MQTT_HOST: mqtt
      SITE: hipe-kit
      MODE: hipe
      SPEED: "5"
    depends_on:
      - mqtt
      - api
    profiles: ["hipe"]

volumes:
  db-data:
